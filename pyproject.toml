[project]
name = "anydoc"
version = "1.0.0"
description = "AnyDoc - document conversion MCP server (Office, PDF, Markdown, images, OCR) protected by MCP Center OAuth 2.1"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2.0",
    "mcp[cli]>=1.24.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    # Conversion engines (pure Python / Rust). pandoc, libreoffice, tesseract and poppler
    # are system packages; see the Dockerfile.
    "firecrawl-anydoc>=0.1.8",   # document -> Markdown (Rust, MIT)
    "pypdf>=5.0.0",              # PDF split / merge / rotate / encrypt
    "pillow>=11.0.0",            # image conversion
]
# Stateless service: no sqlalchemy / alembic / psycopg2

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.1.0",
]

# Build dependencies of the Windows desktop app. Kept as a separate group instead of dev:
# the Linux MCP service never needs them (PyInstaller alone is ~30MB).
#     uv sync --group desktop
desktop = [
    "pyinstaller>=6.11.0",
    "tkinterdnd2>=0.4.0",   # drag-and-drop; without it the GUI falls back to a file picker
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".venv", ".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The desktop app adjusts sys.path before importing the shared conversion code
"desktop/*.py" = ["E402"]

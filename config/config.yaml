# =============================================================================
# AnyDoc configuration
#
# Values may reference environment variables:
#   ${VAR}           required - startup fails when it is unset
#   ${VAR:-default}  optional - falls back to the default
# =============================================================================

server:
  host: "${SERVER_HOST:-0.0.0.0}"
  port: ${SERVER_PORT:-5055}
  transport: "http"

# Bearer tokens are verified against MCP Gate's JWKS (RS256, offline after the first fetch).
# `base_url` is the address this server is reached at; the token audience is derived from it
# (`<base_url>/mcp`) and must equal what MCP Gate registered for this service.
# Set AUTH_ENABLED=false only for local experiments.
auth:
  enabled: ${AUTH_ENABLED:-true}
  issuer: "${MCP_GATE_URL:-http://localhost:4568}"
  base_url: "${ANYDOC_BASE_URL:-http://127.0.0.1:5055}"
  required_scopes: []
  # MCP Gate revocation feed: without it a token revoked in MCP Gate keeps working here
  # until it expires. Needs a confidential client bound to this server in MCP Gate
  # (README -> "Token revocation"). The secret must stay an ${ENV_VAR} reference.
  revocation:
    enabled: ${ANYDOC_REVOCATION_ENABLED:-false}
    client_id: "${ANYDOC_REVOCATION_CLIENT_ID:-}"
    client_secret: "${ANYDOC_REVOCATION_CLIENT_SECRET:-}"
    poll_interval_sec: ${ANYDOC_REVOCATION_POLL_INTERVAL:-30}   # a revocation takes effect within about this long
    fail_mode: "${ANYDOC_REVOCATION_FAIL_MODE:-open}"          # open | closed (reject all tokens when the feed is stale)
    stale_after_intervals: 4                                   # "stale" = no successful poll for 4 x poll_interval_sec

logging:
  level: "${LOG_LEVEL:-INFO}"
  format: "colorized"
  file: "logs/app.log"
  max_size: "10MB"
  backup_count: 3

app:
  name: "AnyDoc"
  title: "AnyDoc"
  description: "Document conversion MCP server: Office, PDF, Markdown, HTML, spreadsheets, presentations and images, plus PDF split / extract / rotate / encrypt."

convert:
  max_input_mb: ${MAX_INPUT_MB:-50}         # per-file limit
  engine_timeout_sec: ${ENGINE_TIMEOUT:-}    # seconds per engine call; empty = each engine's default (LibreOffice 180, Pandoc 120, OCR 300)
  max_hops: 3                               # longest multi-hop conversion path (overrides registry.MAX_HOPS)

modules:
  enabled:
    - anydoc

  anydoc:
    mcp_tools:
      module: "src.fastmcp_tools.anydoc_tools"
      function_name: "register_anydoc_tools"
